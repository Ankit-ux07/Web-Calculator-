<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <input type="" name="" id="input" />
      <div id="inner">
        <button id="btn1">1</button>

        <button id="btn2">2</button>

        <button id="plus" class="operator">+</button>

        <button id="btn3">3</button>

        <button id="btn4">4</button>

        <button id="minus" class="operator">-</button>

        <button id="btn5">5</button>

        <button id="btn6">6</button>

        <button id="multiply" class="operator">*</button>

        <button id="btn7">7</button>

        <button id="btn8">8</button>
        
        <button id="divide" class="operator">/</button>

        <button id="btn9">9</button>

        <button id="btn0">0</button>

        <button id="backspace">⌫</button>

        <button id="clear" class="operator">C</button>

        <button id="btndot">.</button>
        <button class="sizeinc" id="enter">=</button>
      </div>
    </div>

    <script src="1.js"></script>
  </body>
</html>
